name: Feature Request
description: Propose a framework improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: spine
    attributes:
      label: Primary LHF spine
      options:
        - Truth Graph
        - Run Spine
        - Capability Gate
        - Context/Cost Spine
        - Proof Spine
        - Admin Cortex
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: What does this simplify, prove, consolidate, or enforce?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Acceptance proof
      description: Name the command, test, FST task, or receipt that would prove it.
    validations:
      required: true
