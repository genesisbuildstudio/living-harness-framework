name: Release npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lhf:session-close --changed --check
      - name: Verify release tag matches package version
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('packages/create-living-harness/package.json', 'utf8')).version")"
          tag_name="${{ github.event.release.tag_name || github.ref_name }}"
          test "$tag_name" = "v$package_version"
      - run: npm pack --dry-run
        working-directory: packages/create-living-harness
      - run: npm publish --access public
        working-directory: packages/create-living-harness
