name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lhf:validate-contracts
      - run: pnpm lhf:harness-graph --check
      - run: pnpm lhf:check-ai-surfaces
      - run: pnpm lhf:check-doc-size
      - run: pnpm lhf:check-github-actions
      - run: pnpm lhf:check-script-registry
      - run: pnpm lhf:check-secrets
      - run: pnpm lhf:check-supabase-rls
      - run: pnpm lhf:check-supabase-tests
      - run: pnpm lhf:check-wrangler
      - run: pnpm lhf:ticket-contract --check
