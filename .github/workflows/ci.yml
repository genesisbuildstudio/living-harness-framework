name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lhf:validate-contracts
      - run: pnpm lhf:harness-graph --check
      - run: pnpm lhf:check-ai-surfaces
      - run: pnpm lhf:check-doc-size
      - run: pnpm lhf:check-github-actions
      - run: pnpm lhf:check-npm-release
      - run: pnpm lhf:check-template-isolation
      - run: pnpm lhf:check-script-registry
      - run: pnpm lhf:check-secrets
      - run: pnpm lhf:check-supabase-rls
      - run: pnpm lhf:check-supabase-tests
      - run: pnpm lhf:check-wrangler
      - run: pnpm lhf:ticket-contract --check
